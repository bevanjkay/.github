name: Sync shared configurations

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 3" # Every Wednesday at 8 AM
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: "sync-shared-config-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'bevanjkay/.github'
    environment: github_actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - owner: bevanjkay
            repo: bible-api
          - owner: bevanjkay
            repo: custom-scripts
          - owner: bevanjkay
            repo: docker-wwcc
          - owner: bevanjkay
            repo: dotfiles
          - owner: bevanjkay
            repo: fluro-sheet-music
          - owner: bevanjkay
            repo: homebrew-formulae
          - owner: bevanjkay
            repo: homebrew-tap
          - owner: bevanjkay
            repo: modern-square-kds
          - owner: bevanjkay
            repo: n8n-kaynas
          - owner: bevanjkay
            repo: pake-builder
          - owner: bevanjkay
            repo: personal-website
          - owner: bevanjkay
            repo: tools
          - owner: bevanjkay
            repo: yavic-responseportal
          - owner: bevanjkay
            repo: youthalivevictoria
          - owner: gatewaymedia
            repo: dotfiles
          - owner: gatewaymedia
            repo: giving-kiosk
          - owner: gatewaymedia
            repo: handbook
          - owner: gatewaymedia
            repo: homebrew-tap
      fail-fast: false
    steps:
      - name: Clone source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint read token
        id: read_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: read

      - name: Clone target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.owner }}/${{ matrix.repo }}
          path: target
          token: ${{ steps.read_token.outputs.token }}
          persist-credentials: false

      - name: Copy sync files
        run: |
          mkdir -p target/.github/workflows
          cp .github/workflows/actionlint.yml target/.github/workflows/actionlint.yml
          cp .github/zizmor.yml target/.github/zizmor.yml
          cp .github/dependabot-mirror.yml target/.github/dependabot.yml

      - name: Detect changes
        id: detect_changes
        working-directory: target
        env:
          CHANGED_FILES: ${{ runner.temp }}/changed-files.nul
        run: |
          # NUL-delimited throughout so the GraphQL payload never has to guess at
          # a path containing whitespace.
          status_entries="${RUNNER_TEMP}/status.nul"
          git -c status.renames=false status --porcelain=v1 -z -uall > "${status_entries}"
          : > "${CHANGED_FILES}"
          while IFS= read -r -d '' entry; do
            if [[ "${#entry}" -lt 4 || "${entry:2:1}" != " " ]]; then
              echo "::error::unexpected git status record"
              exit 1
            fi
            printf '%s\0' "${entry:3}" >> "${CHANGED_FILES}"
          done < "${status_entries}"

          if [[ ! -s "${CHANGED_FILES}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          tr '\0' '\n' < "${CHANGED_FILES}"
          git diff

      - name: Mint write token
        id: write_token
        if: steps.detect_changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create verified commit and pull request
        if: steps.detect_changes.outputs.changed == 'true'
        working-directory: target
        env:
          APP_SLUG: ${{ steps.write_token.outputs.app-slug }}
          BRANCH: sync-shared-config
          CHANGED_FILES: ${{ runner.temp }}/changed-files.nul
          GH_REPO: ${{ matrix.owner }}/${{ matrix.repo }}
          GH_TOKEN: ${{ steps.write_token.outputs.token }}
          TITLE: Synchronize shared configuration
        run: |
          BOT_USER="${APP_SLUG}[bot]"
          BASE_BRANCH="$(gh api "repos/${GH_REPO}" --jq .default_branch)"
          BASE_SHA="$(git rev-parse HEAD)"

          body_file="${RUNNER_TEMP}/pr-body.md"
          {
            echo "This pull request was created automatically by the [\`sync-shared-config\`](https://github.com/bevanjkay/.github/blob/HEAD/.github/workflows/sync.yml) workflow."
            echo
            echo "Synchronized files:"
            while IFS= read -r -d '' path; do
              printf -- "- \`%s\`\n" "${path}"
            done < "${CHANGED_FILES}"
          } > "${body_file}"

          # Settle ownership before touching anything. Match on the
          # same-repository head only; a fork can hold a branch of the same name
          # and must never be mistaken for ours. An open pull request from this
          # branch that the App did not raise stops the run here, before the
          # branch is reset underneath it.
          open_pulls="$(gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100" | jq -s add)"
          pr_number="$(jq -r \
            --arg repo "${GH_REPO}" \
            --arg branch "${BRANCH}" \
            --arg base "${BASE_BRANCH}" \
            '[.[] | select(.head.repo.full_name == $repo and .head.ref == $branch and .base.ref == $base)] |
             if length > 1 then "ambiguous" else (.[0].number // "") end' <<< "${open_pulls}")"

          if [[ "${pr_number}" == "ambiguous" ]]; then
            echo "::error::more than one open pull request targets ${BRANCH}"
            exit 1
          fi

          if [[ -n "${pr_number}" ]]; then
            author="$(jq -r --argjson n "${pr_number}" '.[] | select(.number == $n) | .user.login' <<< "${open_pulls}")"
            if [[ "${author}" != "${BOT_USER}" ]]; then
              echo "::error::${GH_REPO}#${pr_number} on ${BRANCH} is not owned by ${BOT_USER}"
              exit 1
            fi
          fi

          # Reset the branch to the base tip so the sync commit is always a
          # single commit on current main rather than a stack of stale ones.
          if gh api "repos/${GH_REPO}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api "repos/${GH_REPO}/git/refs/heads/${BRANCH}" -X PATCH \
              -f "sha=${BASE_SHA}" -F force=true
          else
            gh api "repos/${GH_REPO}/git/refs" -X POST \
              -f "ref=refs/heads/${BRANCH}" -f "sha=${BASE_SHA}"
          fi

          # shellcheck disable=SC2016 # Ruby interpolation is intentionally literal to the shell.
          file_changes="$(ruby -rjson -e '
            paths = File.binread(ENV.fetch("CHANGED_FILES")).split("\0").reject(&:empty?)
            additions = []
            deletions = []
            paths.each do |path|
              abort("unsafe path in sync manifest: #{path.inspect}") if path.each_codepoint.any? { |cp| cp < 0x20 || cp == 0x7f }
              if File.symlink?(path)
                abort("symlink in sync manifest: #{path.inspect}")
              elsif File.file?(path)
                additions << { path: path, contents: [File.binread(path)].pack("m0") }
              elsif !File.exist?(path)
                deletions << { path: path }
              else
                abort("non-file in sync manifest: #{path.inspect}")
              end
            end
            print JSON.generate({ additions: additions, deletions: deletions })
          ')"

          # createCommitOnBranch produces a GitHub-signed commit, so the sync is
          # verified without a signing key ever reaching the runner.
          commit_response="${RUNNER_TEMP}/commit-response.json"
          # shellcheck disable=SC2016 # jq variables are intentionally literal to the shell.
          jq -n \
            --arg repo "${GH_REPO}" \
            --arg branch "${BRANCH}" \
            --arg title "${TITLE}" \
            --arg head "${BASE_SHA}" \
            --argjson file_changes "${file_changes}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: $title },
                  fileChanges: $file_changes,
                  expectedHeadOid: $head
                }
              }
            }' | gh api graphql --input - > "${commit_response}"
          commit_oid="$(jq -er '.data.createCommitOnBranch.commit.oid' "${commit_response}")"

          if [[ -n "${pr_number}" ]]; then
            jq -n \
              --arg title "${TITLE}" \
              --rawfile body "${body_file}" \
              '{ title: $title, body: $body }' |
              gh api "repos/${GH_REPO}/pulls/${pr_number}" -X PATCH --input - >/dev/null
          else
            pr_number="$(jq -n \
              --arg title "${TITLE}" \
              --arg head "${BRANCH}" \
              --arg base "${BASE_BRANCH}" \
              --rawfile body "${body_file}" \
              '{ title: $title, head: $head, base: $base, body: $body }' |
              gh api "repos/${GH_REPO}/pulls" -X POST --input - --jq .number)"
          fi

          # Resetting the branch clears any auto-merge already queued, so it has
          # to be re-enabled on every run. expectedHeadOid refuses to queue
          # anything but the commit this run just created.
          #
          # The mutation is called directly rather than through `gh pr merge
          # --auto`, which merges on the spot whenever nothing blocks the pull
          # request. That would let a repository with no required check land
          # the sync without CI; here the request fails and the PR stays open.
          pr_node_id="$(gh api "repos/${GH_REPO}/pulls/${pr_number}" --jq .node_id)"
          auto_merge=false
          for attempt in 1 2 3; do
            # Mergeability is computed asynchronously, so the first attempt can
            # land before GitHub knows the pull request is blocked.
            # shellcheck disable=SC2016 # jq variables are intentionally literal to the shell.
            if jq -n \
                --arg id "${pr_node_id}" \
                --arg head "${commit_oid}" \
                '{
                  query: "mutation($input: EnablePullRequestAutoMergeInput!) { enablePullRequestAutoMerge(input: $input) { pullRequest { autoMergeRequest { enabledAt } } } }",
                  variables: { input: { pullRequestId: $id, mergeMethod: "SQUASH", expectedHeadOid: $head } }
                }' | gh api graphql --input - >/dev/null; then
              auto_merge=true
              break
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 5
            fi
          done
          if [[ "${auto_merge}" != true ]]; then
            echo "::warning::could not enable auto-merge for ${GH_REPO}#${pr_number}; check 'Allow auto-merge' and the required status check on ${BASE_BRANCH}. The pull request is open and needs a manual merge"
          fi

  conclusion:
    needs: sync
    runs-on: ubuntu-slim
    permissions: {}
    if: always()
    steps:
      - name: Result
        env:
          RESULT: ${{ needs.sync.result }}
        run: |
          [[ "${RESULT}" == success ]]
