schema: 1

# Overrides for residechurch/server. Everything not named here comes from
# sync/defaults.yml.

# Merging a pull request in this repository deploys it, so image bumps should
# arrive within days rather than wait for the monthly run.
schedule:
  interval: daily
cooldown:
  default-days: 2
  reason: |-
    Below zizmor's 7-day floor by choice: merging deploys, so bumps should land
    within days, and two still lets a broken release be pulled before it is
    proposed.

dependabot:
  docker-compose:
    # One pull request per image, so each touches one stack and merging it
    # redeploys only that stack. Dependabot cannot group per directory.
    grouped: false
    groups:
      immich:
        reason: |-
          Immich's server and machine-learning images must run the same
          release, so they are proposed and merged together.
        patterns:
          - "*immich-app/immich-*"
    ignore:
      - dependency-name: "*mariadb"
        reason: |-
          MariaDB minors can cross LTS lines and convert the data files on
          first start, with no way back. Dump the database and bump it by hand.
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: mattermost/mattermost-team-edition
        reason: |-
          Majors change database and plugin requirements and cannot be rolled
          back cleanly once people have signed in. Bump by hand.
        update-types:
          - version-update:semver-major
      - dependency-name: portainer/agent
        reason: |-
          The agent must match its server's version. Bump both together by
          hand.
