schema: 1

# Overrides for bevanjkay/kaynas-compose. Everything not named here comes from
# sync/defaults.yml.

# Merging a stack's pull request deploys it to the homelab, so image bumps
# should arrive within days rather than wait for the monthly run.
schedule:
  interval: daily
cooldown:
  default-days: 2
  reason: |-
    Below zizmor's 7-day floor by choice: homelab images should land within
    days, and two still lets a broken release be pulled before it is proposed.

dependabot:
  docker-compose:
    # One pull request per image, so each touches one stack and merging it
    # redeploys only that stack. Dependabot cannot group per directory.
    grouped: false
    ignore:
      - dependency-name: "*meilisearch"
        reason: |-
          Meilisearch can refuse to open a database written by an older minor
          without a dump and import, which takes Karakeep search down until it
          is rebuilt. Bump it by hand.
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
